name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "pytest.ini"
      - "backend/requirements.txt"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pytest.ini"
      - "backend/requirements.txt"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: Backend unit and API tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholaris
          POSTGRES_PASSWORD: scholaris
          POSTGRES_DB: scholaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholaris -d scholaris_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://scholaris:scholaris@localhost:5432/scholaris_test
      JWT_SECRET_KEY: ci-backend-secret-key-with-at-least-32-characters
      APP_ENV: test
      DEBUG: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests against PostgreSQL
        run: python -m pytest backend/tests -q
