name: Backend tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholaris
          POSTGRES_PASSWORD: scholaris
          POSTGRES_DB: scholaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholaris -d scholaris_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://scholaris:scholaris@localhost:5432/scholaris_test
      TEST_DATABASE_URL: postgresql+psycopg2://scholaris:scholaris@localhost:5432/scholaris_test
      TEST_DATABASE_IS_DISPOSABLE: "1"
      JWT_SECRET_KEY: test-secret-key-with-at-least-32-characters
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r backend/requirements.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: pytest backend/tests/test_migrations.py -q
      - run: pytest backend/tests/test_deadline_email_worker.py backend/tests/test_deadline_email_scheduler.py backend/tests/test_deadline_email_service.py -q
      - run: pytest backend/tests --collect-only -q
